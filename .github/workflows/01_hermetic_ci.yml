name: Hermetic CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nix-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Flake check
        run: nix flake check --no-build
      - name: Native import and linker gate
        run: nix develop --command python3 -c "import torchcodec.decoders"
